<div class="pos-page">
  <aside class="pos-sidebar pos-desktop-only">
    <div class="sidebar-card">
      <app-open-order-switcher />

      <button type="button" class="new-order-button" (click)="createOrder()" aria-label="New order">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <span>New Order</span>
      </button>
    </div>
  </aside>

  <section class="pos-products">
    <app-product-grid />
  </section>

  <aside class="pos-order pos-desktop-only">
    <div class="order-panel-card">
      <app-order-editor [showDeleteButton]="true" />
    </div>
  </aside>

  <app-open-order-bubbles (openCart)="openCart()" />

  @if (cartOpen()) {
    <app-order-cart-panel (closed)="closeCart()" />
  }
</div>
