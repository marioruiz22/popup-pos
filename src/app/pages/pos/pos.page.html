<div class="pos-page">
  <aside class="pos-sidebar pos-desktop-only">
    <app-open-order-switcher />

    @if (hasOpenOrders) {
      <button type="button" class="action-button" (click)="createOrder()">
        New Order
      </button>
    }
  </aside>

  <section class="pos-products">
    <app-product-grid />
  </section>

  <aside class="pos-order pos-desktop-only">
    <app-order-editor [showDeleteButton]="true" />
  </aside>

  <app-open-order-bubbles (openCart)="openCart()" />

  @if (cartOpen) {
    <app-order-cart-panel (closed)="closeCart()" />
  }
</div>
