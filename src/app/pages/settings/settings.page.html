<div class="settings-page">
  <header class="page-header">
    <div>
      <h2>Settings</h2>
      <p class="page-subtitle">Customize this device for your popup</p>
    </div>
  </header>

  <form class="settings-form" (ngSubmit)="save()">
    <section class="form-card">
      <label class="field">
        Popup name
        <input
          name="popupName"
          [(ngModel)]="popupName"
          [placeholder]="defaultTitle"
          maxlength="40"
        />
      </label>
      <p class="field-hint">Shown in the app header instead of “{{ defaultTitle }}” when set.</p>

      <label class="field">
        Device name
        <input
          name="deviceName"
          [(ngModel)]="deviceName"
          placeholder="e.g. iPad 1 / Register A"
          maxlength="40"
        />
      </label>
      <p class="field-hint">Added to orders completed on this device.</p>
    </section>

    <button type="submit" class="save-button">Save Settings</button>

    @if (savedMessage) {
      <p class="saved-message" role="status">{{ savedMessage }}</p>
    }
  </form>
</div>
