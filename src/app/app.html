<div class="app-shell" [class.join-only]="!isJoined()">
  @if (isJoined()) {
    <header class="app-header">
      <div class="app-brand">
        <img
          class="app-brand-icon"
          src="icons/icon-192x192.png"
          width="36"
          height="36"
          alt=""
        />
        <h1 class="app-title">{{ displayTitle() }}</h1>
      </div>

      <div class="app-header-actions">
        <app-nav class="nav-desktop"></app-nav>

        <a
          class="settings-link"
          routerLink="/settings"
          routerLinkActive="active"
          aria-label="Settings"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
            <path
              d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"
              stroke="currentColor"
              stroke-width="1.75"
            />
            <path
              d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.1.6.5 1.1 1.1 1.3.2.1.3.1.5.1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </a>
      </div>
    </header>
  }

  <main class="app-main" [class.join-main]="!isJoined()">
    <router-outlet />
  </main>

  @if (isJoined()) {
    <app-nav class="nav-mobile"></app-nav>
  }
</div>
