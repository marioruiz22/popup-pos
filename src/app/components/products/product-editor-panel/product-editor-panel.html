<div class="editor-backdrop" (click)="onBackdropClick()">
  <section
    class="editor-panel"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title"
    (click)="$event.stopPropagation()"
  >
    <header class="editor-header">
      <button type="button" class="editor-close" (click)="close()" aria-label="Close">×</button>
      <h2 class="editor-title">{{ title }}</h2>
      @if (isEditing) {
        <button type="button" class="editor-delete" (click)="deleteProduct()" aria-label="Delete product">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
            <path d="M4 7h16" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
            <path d="M10 11v6M14 11v6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
            <path
              d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      } @else {
        <span class="editor-spacer" aria-hidden="true"></span>
      }
    </header>

    <div class="editor-body">
      <form class="product-form" (ngSubmit)="submit()">
        <section class="form-card">
          <label class="field">
            Name
            <input name="name" [(ngModel)]="form.name" required placeholder="Product name" />
          </label>

          <label class="field">
            Price
            <div class="money-input">
              <span class="money-prefix">$</span>
              <input
                name="price"
                type="number"
                min="0"
                step="0.01"
                [(ngModel)]="form.price"
                required
                placeholder="0.00"
              />
              <button
                type="button"
                class="money-clear"
                (click)="clearPrice()"
                [disabled]="form.price == null"
                aria-label="Clear price"
              >
                ×
              </button>
            </div>
          </label>
        </section>

        <section class="form-card image-card">
          <span class="field-label">Product image</span>

          <div class="image-row">
            @if (hasImage) {
              <img [src]="form.imageUrl" alt="Product preview" class="image-preview" />
              <div class="image-actions">
                <button type="button" class="clear-image" (click)="clearImage()">Remove</button>
                <label class="file-picker">
                  <input
                    type="file"
                    accept="image/*"
                    (change)="onImageSelected($event)"
                    [disabled]="imageProcessing"
                  />
                  <span>{{ imageProcessing ? 'Processing…' : 'Replace' }}</span>
                </label>
              </div>
            } @else {
              <div class="image-preview placeholder" aria-hidden="true">{{ imageInitial }}</div>
              <div class="image-actions">
                <label class="file-picker">
                  <input
                    type="file"
                    accept="image/*"
                    (change)="onImageSelected($event)"
                    [disabled]="imageProcessing"
                  />
                  <span>{{ imageProcessing ? 'Processing…' : 'Add image' }}</span>
                </label>
              </div>
            }
          </div>

          @if (imageError) {
            <p class="image-error">{{ imageError }}</p>
          }
        </section>

        <section class="form-card toggle-card">
          <div class="toggle-copy">
            <strong>Active</strong>
            <span>Show this product on the POS</span>
          </div>
          <label class="toggle">
            <input name="active" type="checkbox" [(ngModel)]="form.active" />
            <span class="toggle-track" aria-hidden="true">
              <span class="toggle-thumb"></span>
            </span>
          </label>
        </section>

        <button type="submit" class="save-button" [disabled]="!canSave">
          {{ isEditing ? 'Save Changes' : 'Add Product' }}
        </button>
      </form>
    </div>
  </section>
</div>
