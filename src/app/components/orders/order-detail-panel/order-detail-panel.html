<div class="detail-backdrop">
  <section class="detail-panel" role="dialog" aria-modal="true" aria-label="Order details">
    <header class="detail-header">
      <button type="button" class="detail-close" (click)="close()" aria-label="Close details">×</button>
      <h2 class="detail-title">Order Details</h2>
      <button type="button" class="detail-delete" (click)="deleteOrder()" aria-label="Delete order">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
          <path d="M4 7h16" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
          <path d="M10 11v6M14 11v6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
          <path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </header>

    <div class="detail-body">
      @if (order) {
        <app-order-editor
          [orderId]="orderId()"
          [showHeading]="false"
          [showCompleteButton]="false"
          [showDeleteButton]="false"
          [touchFriendly]="true"
        />

        @if (order.status === 'completed') {
          <button type="button" class="reopen-button" (click)="reopenOrder()">
            Reopen Order
          </button>
        }
      } @else {
        <p class="detail-empty">Order not found.</p>
      }
    </div>
  </section>
</div>
