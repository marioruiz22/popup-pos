@if (hasOpenOrders) {
  <div class="bubbles-bar">
    <div #bubblesScroll class="bubbles-scroll" aria-label="Open orders">
      <div class="bubbles-track">
        @for (order of openOrders; track order.id) {
          <button
            type="button"
            class="order-bubble"
            [class.active]="order.id === currentOrderId"
            (click)="onOrderClick(order.id)"
            [attr.aria-label]="bubbleAriaLabel(order)"
          >
            <span class="bubble-cart" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" focusable="false">
                <path
                  d="M7 7h13l-1.2 8.5a2 2 0 0 1-2 1.7H9.2a2 2 0 0 1-2-1.6L5.5 4H3"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <circle cx="10" cy="20" r="1.25" fill="currentColor" />
                <circle cx="17" cy="20" r="1.25" fill="currentColor" />
              </svg>
              @if (getItemCount(order) > 0) {
                <span class="bubble-count">{{ getItemCount(order) }}</span>
              }
            </span>

            <span class="bubble-copy">
              @if (bubbleLabel(order); as label) {
                <span class="bubble-label">{{ label }}</span>
              } @else if (showTabChip(order)) {
                <span class="bubble-tab" [style.--tab-accent]="tabAccent(order)">
                  {{ order.tabLetter }}
                </span>
              }
              <span class="bubble-total">${{ getTotal(order).toFixed(2) }}</span>
            </span>
          </button>
        }

        <button type="button" class="new-order-bubble" (click)="createOrder()" aria-label="New order">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>
  </div>
}
