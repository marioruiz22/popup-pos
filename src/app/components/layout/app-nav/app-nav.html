<nav class="app-nav">
  @for (item of navItems; track item.path) {
    <a
      class="nav-link"
      [routerLink]="item.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="nav-icon" aria-hidden="true">
        @switch (item.icon) {
          @case ('products') {
            <svg viewBox="0 0 24 24" fill="none" focusable="false">
              <path
                d="M4.5 8.5 12 4l7.5 4.5v7L12 20l-7.5-4.5v-7Z"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linejoin="round"
              />
              <path
                d="M12 12v8M4.5 8.5 12 12l7.5-3.5"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          }
          @case ('sell') {
            <svg viewBox="0 0 24 24" fill="none" focusable="false">
              <path
                d="M7 7h13l-1.2 8.5a2 2 0 0 1-2 1.7H9.2a2 2 0 0 1-2-1.6L5.5 4H3"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="10" cy="20" r="1.25" fill="currentColor" />
              <circle cx="17" cy="20" r="1.25" fill="currentColor" />
            </svg>
          }
          @case ('sales') {
            <svg viewBox="0 0 24 24" fill="none" focusable="false">
              <path
                d="M7 4h8.5L19 7.5V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linejoin="round"
              />
              <path
                d="M15 4v4h4M9 12h6M9 16h6"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          }
        }
      </span>
      <span class="nav-label">{{ item.label }}</span>
    </a>
  }
</nav>
